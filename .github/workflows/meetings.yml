name: Update group meetings

# Regenerates meetings.html from Indico using indicomb
# (https://gitlab.cern.ch/indicomb/indicomb).
# Requires the INDICO_API_TOKEN repository secret: create a token at
# https://indico.cern.ch/user/tokens/ (read-only "Classic API" scope)
# and add it under Settings > Secrets and variables > Actions.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indicomb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for token
        run: |
          if [ -z "${{ secrets.INDICO_API_TOKEN }}" ]; then
            echo "::error::INDICO_API_TOKEN secret is not set"
            exit 1
          fi

      - name: Fetch indicomb
        run: git clone --depth 1 https://gitlab.cern.ch/indicomb/indicomb.git /tmp/indicomb

      - name: Generate meetings page
        env:
          INDICO_API_TOKEN: ${{ secrets.INDICO_API_TOKEN }}
        run: |
          python3 /tmp/indicomb/indicomb.py \
            --output meetings-raw.html \
            --API_TOKEN "$INDICO_API_TOKEN" \
            --categoryNumbers 704 \
            --includeList "Burzynski Group Meeting" \
            --startDate 2026-01-01 \
            --endDate +60d \
            --calendarName meetings.ics \
            --noTopbar
          python3 tools/build_meetings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meetings.html meetings-raw.html meetings.ics || true
          if ! git diff --cached --quiet; then
            git commit -m "Update group meetings from Indico"
            git push
          else
            echo "No changes"
          fi
